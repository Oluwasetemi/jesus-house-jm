backend:
  name: git-gateway
  branch: main

# No media uploads — images are URL strings
media_folder: ''
public_folder: ''

# Slug options
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

collections:
  # ── Blog Posts ─────────────────────────────────────────────────────
  - name: blog
    label: Blog Posts
    label_singular: Blog Post
    folder: src/content/blog
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{title}} — {{date}}'
    fields:
      - {label: Title, name: title, widget: string}
      - {label: Excerpt, name: excerpt, widget: text}
      - label: Category
        name: category
        widget: select
        options:
          - {label: Devotionals, value: devotionals}
          - {label: Church News, value: news}
          - {label: Faith & Life, value: faith}
          - {label: Community, value: community}
      - {label: Date, name: date, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false, picker_utc: true}
      - {label: Author, name: author, widget: string}
      - {label: Read Time, name: readTime, widget: string, hint: e.g. 4 min read}
      - {label: Featured, name: featured, widget: boolean, default: false}
      - {label: Cover Image URL, name: coverImage, widget: string, required: false, hint: Paste a full image URL}
      - {label: Body, name: body, widget: markdown}

  # ── Events ─────────────────────────────────────────────────────────
  - name: events
    label: Events
    label_singular: Event
    folder: src/content/events
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{title}} — {{date}}'
    fields:
      - {label: Title, name: title, widget: string}
      - {label: Date, name: date, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false, picker_utc: true}
      - {label: Time, name: time, widget: string, hint: 'e.g. 9:00 AM'}
      - {label: Location, name: location, widget: string}
      - {label: Description, name: description, widget: text}
      - {label: Image URL, name: image, widget: string, required: false, hint: Paste a full image URL}
      - {label: Featured, name: featured, widget: boolean, default: false}
      - {label: Registration URL, name: registrationUrl, widget: string, required: false}
      - {label: Body, name: body, widget: markdown, required: false}

  # ── Podcast Episodes ───────────────────────────────────────────────
  - name: podcast
    label: Podcast Episodes
    label_singular: Podcast Episode
    folder: src/content/podcast
    create: true
    delete: false
    extension: md
    format: frontmatter
    slug: 'episode-{{fields.episodeNumber}}'
    summary: 'Ep {{fields.episodeNumber}} — {{fields.videoId}}'
    fields:
      - {label: YouTube Video ID, name: videoId, widget: string, hint: 'e.g. VnqO4Jj-NZY'}
      - {label: Episode Number, name: episodeNumber, widget: number, value_type: int, min: 1}
      - label: Topics
        name: topics
        widget: list
        default: []
        hint: One topic per entry
        field: {label: Topic, name: topic, widget: string}
      - label: Transcript
        name: transcript
        widget: list
        required: false
        default: []
        hint: 'Auto-generate with: python3 scripts/fetch-transcript.py <videoId> --episode N --write'
        summary: '{{fields.timestamp}} — {{fields.text}}'
        fields:
          - {label: Timestamp, name: timestamp, widget: string, hint: 'e.g. 1:23 or 12:34'}
          - {label: Speaker, name: speaker, widget: string, required: false, default: '', hint: 'Amarachi / Ruth / Joseph — leave blank if unknown'}
          - {label: Text, name: text, widget: text}
      - {label: Show Notes, name: body, widget: markdown, required: false}

  # ── Sermon Timestamps ──────────────────────────────────────────────
  - name: sermons
    label: Sermon Timestamps
    label_singular: Sermon Timestamp
    folder: src/content/sermons
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: '{{fields.videoId}}'
    summary: '{{fields.videoId}} — t={{fields.timestamp}}s'
    fields:
      - {label: YouTube Video ID, name: videoId, widget: string, hint: 'The video ID from the YouTube URL, e.g. Dag-OB5lpc4'}
      - {label: Start Timestamp (seconds), name: timestamp, widget: number, value_type: int, min: 0, required: false, hint: 'Seconds into the video where the sermon begins, e.g. 233'}

  # ── Image Gallery ──────────────────────────────────────────────────
  - name: gallery
    label: Image Gallery
    label_singular: Album
    folder: src/content/gallery
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{title}} — {{date}}'
    fields:
      - {label: Title, name: title, widget: string}
      - {label: Date, name: date, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false, picker_utc: true}
      - {label: Description, name: description, widget: text, required: false}
      - {label: Cover Image URL, name: coverImage, widget: string, required: false, hint: Paste a full image URL}
      - label: Images
        name: images
        widget: list
        summary: '{{fields.alt}}'
        fields:
          - {label: Image URL, name: url, widget: string, hint: Paste a full image URL}
          - {label: Alt Text, name: alt, widget: string, hint: Describe the image for accessibility}
          - {label: Caption, name: caption, widget: string, required: false}
