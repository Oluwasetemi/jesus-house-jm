name: Fetch Latest YouTube Videos

# Runs after each service day to pull new recordings into videos.json
# Jamaica is UTC-5; schedules below are timed so even long streams have ended.
#   Sunday Service  → runs at 19:00 UTC (2:00 PM Jamaica) — safe for 4-hr services
#   Monday Prayer   → runs at 11:00 UTC  (6:00 AM Jamaica)
#   Wednesday Study → runs at 01:30 UTC Thu (8:30 PM Jamaica Wed)
# Netlify rebuild is triggered automatically when videos.json is pushed (git push webhook).
# [skip ci] on the commit prevents a GitHub Actions re-run loop but Netlify still rebuilds.
on:
  schedule:
    - cron: '0 19 * * 0'   # Sunday 19:00 UTC (2:00 PM Jamaica) — after even 4-hr services
    - cron: '0 11 * * 1'   # Monday 11:00 UTC (6:00 AM Jamaica)
    - cron: '30 1 * * 4'   # Thursday 01:30 UTC (Wednesday 8:30 PM Jamaica)
  workflow_dispatch:        # allow manual trigger from GitHub Actions UI

jobs:
  update-videos:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed to push the updated JSON

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Fetch latest 15 recordings and merge
        run: |
          python3 scripts/fetch-youtube.py \
            --limit 15 \
            --merge \
            --out src/data/videos.json

      - name: Check for changes
        id: diff
        run: |
          git diff --quiet src/data/videos.json && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push updated videos.json
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/videos.json
          git commit -m "chore: update YouTube video archive [skip ci]"
          git push
